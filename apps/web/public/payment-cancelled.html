<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment not completed · Isla Azul Beach Resort</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        border: 1px solid #334155;
        background: #0f172a;
        border-radius: 14px;
        padding: 28px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #94a3b8;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Payment not completed</h1>
      <p>
        Your room is still held until the timer on the booking form runs out. Go back to the call to
        pay or cancel the hold.
      </p>
    </div>
  </body>
</html>
