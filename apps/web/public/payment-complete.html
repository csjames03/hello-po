<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment received · Isla Azul Beach Resort</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        border: 1px solid #065f46;
        background: #022c22;
        border-radius: 14px;
        padding: 28px;
      }
      .tick {
        font-size: 40px;
        color: #6ee7b7;
      }
      h1 {
        font-size: 20px;
        margin: 8px 0;
      }
      p {
        color: #94a3b8;
        line-height: 1.5;
        margin: 0;
      }
      code {
        color: #a7f3d0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tick" aria-hidden="true">✓</div>
      <h1>Payment received</h1>
      <p>
        Booking <code id="code"></code> is being confirmed. You can close this tab and go back to
        the call. Mara will confirm it out loud.
      </p>
    </div>
    <script>
      document.getElementById('code').textContent =
        new URLSearchParams(location.search).get('booking') ?? '';
      // This tab was opened by the booking form, so it may close itself.
      setTimeout(() => window.close(), 2500);
    </script>
  </body>
</html>
